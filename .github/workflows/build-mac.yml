# Builds the macOS app (.dmg) on a GitHub-hosted Apple Silicon Mac.
# Run it from the repo's "Actions" tab ("Build macOS app" > "Run workflow"):
# the .dmg is then under the finished run's "Artifacts" (downloaded as a .zip).
# Or release a version: bump filmconv.__version__, then
#   git tag v0.3.0 && git push origin v0.3.0
# which also creates a DRAFT GitHub Release with the .dmg and HOW_IT_WORKS.md
# attached. Review it on GitHub and click "Publish release".
# Repo: github.com/shmengel/film-converter (private).
name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write     # creating the draft release

jobs:
  build-mac:
    # Apple Silicon (arm64). macos-14 runners are retired; the app still supports
    # macOS 14+, since it only bundles prebuilt macOS 14 wheels (nothing is compiled).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import filmconv; print(filmconv.__version__)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match filmconv.__version__ ($version)"; exit 1
          fi

      - name: Build, test and package
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash tools/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FilmConverter-mac
          path: build/installer/*.dmg
          if-no-files-found: error

      - name: Draft a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # HOW_IT_WORKS.md must be attached to every release (see CLAUDE.md).
          gh release create "$GITHUB_REF_NAME" build/installer/*.dmg docs/HOW_IT_WORKS.md \
            --draft --title "Film Converter ${GITHUB_REF_NAME#v}" --generate-notes

      - name: Smoke-test report (on failure)
        if: failure()
        run: cat build/smoke/smoke-test.txt || true
