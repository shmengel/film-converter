# Builds the macOS app (.dmg) on a GitHub-hosted Apple Silicon Mac.
# Run it from the repo's "Actions" tab ("Build macOS app" > "Run workflow"),
# or push a version tag (git tag v0.3.0 && git push --tags).
# The .dmg is under the finished run's "Artifacts" (downloaded as a .zip).
# Repo: github.com/shmengel/film-converter (private).
name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-mac:
    # Apple Silicon (arm64). macos-14 runners are retired; the app still supports
    # macOS 14+, since it only bundles prebuilt macOS 14 wheels (nothing is compiled).
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Build, test and package
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
        run: bash tools/build_mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FilmConverter-mac
          path: build/installer/*.dmg
          if-no-files-found: error

      - name: Smoke-test report (on failure)
        if: failure()
        run: cat build/smoke/smoke-test.txt || true
